<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Resource Hub</title>
    
    <link rel="stylesheet" href="stylesheet.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
</head>
<body>

    <nav id="navbar">
        <div class="nav-logo">SLTX Connect</div>
        <ul>
            <a href="index.html">HOME</a>
            <a href="directory.html">DIRECTORY</a>
            <a href="leisure.html">LEISURE</a>
            <a href="references.html">REFERENCES</a>
            <a href="TSAinfo.html">ABOUT TSA</a>
        </ul>
    </nav>

    <main>
        <h1>Directory</h1>
        <p class="sub"> Our directory includes all of Sugar Land's finest resources; you can browse local organizations, events, and services in the community, using our helpful filters! 
        </p>

        <div style="background: var(--paper-bg); padding: 1rem; border: 1px solid var(--ink-color); margin-bottom: 2rem; box-shadow: 5px 5px 0 var(--shadow-color);">
            
            <input type="text" id="search-input" placeholder="Type here to search by name...">

            <div class="filter-toolbar" style="border: none; padding: 0; background: transparent; margin-bottom: 0;">
                
                <div class="filter-group">
                    <label>Type:</label>
                    <div class="multiselect-container">
                        <div id="filter-type-tags" class="tags-container"></div>
                        <div class="multiselect-dropdown">
                            <button class="multiselect-btn" id="filter-type-btn">Select Types ▼</button>
                            <div class="multiselect-menu" id="filter-type-menu">
                                <label><input type="checkbox" value="Non-Profit"> Non-Profit</label>
                                <label><input type="checkbox" value="Community Event"> Community Event</label>
                                <label><input type="checkbox" value="Support Service"> Support Service</label>
                                <label><input type="checkbox" value="Fundraiser/Donation"> Fundraiser/Donation</label>
                                <label><input type="checkbox" value="Volunteering"> Volunteering</label>
                                <label><input type="checkbox" value="Other"> Other</label>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="filter-group">
                    <label>Category:</label>
                    <div class="multiselect-container">
                        <div id="filter-category-tags" class="tags-container"></div>
                        <div class="multiselect-dropdown">
                            <button class="multiselect-btn" id="filter-category-btn">Select Categories ▼</button>
                            <div class="multiselect-menu" id="filter-category-menu">
                                <label><input type="checkbox" value="Food"> Food</label>
                                <label><input type="checkbox" value="Youth"> Youth</label>
                                <label><input type="checkbox" value="Housing"> Housing</label>
                                <label><input type="checkbox" value="Physical Health/Wellness"> Physical Health/Wellness</label>
                                <label><input type="checkbox" value="Safety"> Safety</label>
                                <label><input type="checkbox" value="Mental Health"> Mental Health</label>
                                <label><input type="checkbox" value="Career/College"> Career/College</label>
                                <label><input type="checkbox" value="Fun"> Fun</label>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="filter-group">
                    <label>Between:</label>
                    <input type="date" id="filter-date-start">
                </div>
                
                <div class="filter-group">
                    <label>And:</label>
                    <input type="date" id="filter-date-end">
                </div>
                
                <div class="filter-group" style="flex-direction: row; gap: 10px;">
                    <button id="search-btn" class="vintage-btn">Apply Filters</button>
                    <button id="clear-filters-btn" class="vintage-btn" style="opacity: 0.7;">Clear</button>
                </div>
            </div>
        </div>

        <div id="spotlight-container" class="spotlight-section" style="display: none;">
            <h2 style="text-align: center; margin-top: 0;">★ Spotlight Picks ★</h2>
            <div id="spotlight-list" class="spotlight-grid"></div>
        </div>

        <div id="resource-list">
            <p align="center">Retrieving archives...</p>
        </div>

    </main>

    <script src="directory.js"></script>

</body>
</html>
